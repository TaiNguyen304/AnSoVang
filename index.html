<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ẩn Số Vàng</title>
    <meta name="description" content="Hệ thống web đa trang kết nối với máy chủ Ẩn Số Vàng trên Render, hỗ trợ bảo mật DevTools và tối ưu hiển thị." />
    <meta property="og:title" content="Ẩn Số Vàng Hub" />
    <meta property="og:description" content="Hệ thống web đa trang kết nối với máy chủ Ẩn Số Vàng trên Render, hỗ trợ bảo mật DevTools và tối ưu hiển thị." />

    <!-- 100% font-weight là bold cho tất cả các phần tử -->
    <style>
      *, *::before, *::after {
        font-weight: bold !important;
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: radial-gradient(circle at center, #1e293b 0%, #0b1120 100%);
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      /* Nút bấm và hiệu ứng hover */
      button, .btn, a.btn, input[type='button'], input[type='submit'], input[type='reset'] {
        cursor: pointer;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition: background-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
        outline: none;
        will-change: background-color, color, box-shadow;
      }
      button:hover, .btn:hover, a.btn:hover, input[type='button']:hover, input[type='submit']:hover, input[type='reset']:hover,
      button:hover *, .btn:hover *, a.btn:hover * {
        background: #eab308 !important;
        background-color: #eab308 !important;
        background-image: none !important;
        color: #000000 !important;
        border-color: #eab308 !important;
        box-shadow: 0 0 15px rgba(234, 179, 8, 0.6) !important;
        filter: none !important;
      }
      button:active, .btn:active {
        opacity: 0.85;
      }
      input, select {
        font-family: inherit;
        outline: none;
      }
      input:focus, select:focus {
        border-color: #facc15 !important;
        box-shadow: 0 0 10px rgba(250, 204, 21, 0.3) !important;
      }
    </style>

    <!-- Kích hoạt disableDevTools và kết nối OnRender -->
    <script>
      window.RENDER_SERVER_URL = "https://ansovang.onrender.com";
      window.APP_PAGES = {
        controller: "Controller.html",
        host: "Host.html",
        player1: "Player1.html",
        player2: "Player2.html",
        player3: "Player3.html",
        player4: "Player4.html",
        viewer: "Viewer.html"
      };

      function disableDevTools() {
        window.addEventListener('keydown', function (e) {
          if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          const isCmdOrCtrl = e.ctrlKey || e.metaKey;
          if (isCmdOrCtrl && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c', 'K', 'k'].includes(e.key)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          if (isCmdOrCtrl && ['u', 'U', 's', 'S', 'p', 'P'].includes(e.key)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }, true);

        window.addEventListener('contextmenu', function (e) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }, true);

        window.addEventListener('dragstart', function (e) {
          e.preventDefault();
          return false;
        }, true);
      }

      disableDevTools();
      window.disableDevTools = disableDevTools;
    </script>
    <script src="./sync-client.js"></script>
  </head>
  <body>
    <div style="width: 100%; max-width: 400px; background: #0f172a; border: 2px solid #eab308; border-radius: 14px; padding: 24px 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 14px;">
      
      <!-- Tiêu đề (Không có icon) -->
      <div style="text-align: center; border-bottom: 1.5px solid #334155; padding-bottom: 12px;">
        <h1 style="margin: 0; font-size: 18px; color: #facc15; letter-spacing: 0.5px; text-transform: uppercase;">ĐĂNG NHẬP THÍ SINH</h1>
        <p style="margin: 4px 0 0 0; font-size: 11px; color: #94a3b8;">ẨN SỐ VÀNG - HỆ THỐNG THI ĐẤU</p>
      </div>

      <!-- Thông báo lỗi nếu sai mã phòng / mật khẩu -->
      <div id="login-error-box" style="display: none; background: #7f1d1d; border: 1.5px solid #ef4444; border-radius: 8px; padding: 8px 12px; color: #fecaca; font-size: 12px; text-align: center;">
      </div>

      <!-- Form 3 ô -->
      <form id="login-form" style="display: flex; flex-direction: column; gap: 12px;">
        
        <!-- Ô 1: Chọn vị trí từ 1 - 4 -->
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <label for="select-player" style="font-size: 11px; color: #cbd5e1; text-transform: uppercase;">VỊ TRÍ PLAYER:</label>
          <select id="select-player" style="background: #1e293b; color: #ffffff; border: 1.5px solid #475569; border-radius: 8px; padding: 8px 10px; font-size: 13px; cursor: pointer;">
            <option value="1">Player 1</option>
            <option value="2">Player 2</option>
            <option value="3">Player 3</option>
            <option value="4">Player 4</option>
          </select>
        </div>

        <!-- Ô 2: Nhập mã phòng (6 chữ số) -->
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <label for="input-roomid" style="font-size: 11px; color: #cbd5e1; text-transform: uppercase;">MÃ PHÒNG (6 CHỮ SỐ):</label>
          <input id="input-roomid" type="text" maxlength="6" placeholder="Nhập mã phòng 6 số" autocomplete="off" style="background: #1e293b; color: #facc15; border: 1.5px solid #475569; border-radius: 8px; padding: 8px 10px; font-size: 14px; letter-spacing: 2px; text-align: center;" />
        </div>

        <!-- Ô 3: Nhập mật khẩu (4 chữ số) -->
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <label for="input-auth" style="font-size: 11px; color: #cbd5e1; text-transform: uppercase;">MẬT KHẨU PLAYER (4 CHỮ SỐ):</label>
          <input id="input-auth" type="password" maxlength="4" placeholder="Nhập mật khẩu 4 số" autocomplete="off" style="background: #1e293b; color: #ffffff; border: 1.5px solid #475569; border-radius: 8px; padding: 8px 10px; font-size: 14px; letter-spacing: 2px; text-align: center;" />
        </div>

        <!-- Nút Đăng nhập -->
        <button type="submit" class="btn" style="background: linear-gradient(135deg, #0284c7, #0369a1); color: #ffffff; border: 1.5px solid #38bdf8; border-radius: 8px; padding: 10px; font-size: 13px; text-transform: uppercase; margin-top: 4px;">
          VÀO PHÒNG THI ĐẤU
        </button>

        <!-- Tùy chọn máy chủ: Chạy Local hoặc OnRender -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px; padding-top: 10px; border-top: 1px solid #1e293b; font-size: 11px; color: #94a3b8;">
          <span id="server-status-label">Máy chủ: <b style="color: #38bdf8;">Đang xác định...</b></span>
          <select id="server-select-switch" style="background: #1e293b; color: #facc15; border: 1px solid #475569; border-radius: 6px; padding: 3px 6px; font-size: 11px; cursor: pointer;">
            <option value="auto">Tự động nhận diện</option>
            <option value="local">Local (localhost:3000)</option>
            <option value="render">OnRender (Cloud)</option>
          </select>
        </div>
      </form>
    </div>

    <script>
      const form = document.getElementById('login-form');
      const errBox = document.getElementById('login-error-box');

      const serverSwitch = document.getElementById('server-select-switch');
      const serverLabel = document.getElementById('server-status-label');
      if (serverSwitch && serverLabel) {
        const currentTarget = localStorage.getItem('anso_target_server') || 'auto';
        serverSwitch.value = currentTarget;
        const currentUrl = (window.getServerBaseUrl ? window.getServerBaseUrl() : window.location.origin) || 'Localhost:3000';
        serverLabel.innerHTML = `Máy chủ: <b style="color: #38bdf8;">${currentUrl.replace(/^https?:\/\//, '')}</b>`;

        serverSwitch.addEventListener('change', (e) => {
          const val = e.target.value;
          if (window.switchServerTarget) {
            window.switchServerTarget(val === 'auto' ? '' : val);
          }
        });
      }

      function showError(msg) {
        errBox.textContent = msg;
        errBox.style.display = 'block';
      }

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        errBox.style.display = 'none';

        const playerVal = document.getElementById('select-player').value;
        const roomId = (document.getElementById('input-roomid').value || '').trim();
        const auth = (document.getElementById('input-auth').value || '').trim();

        if (!roomId || roomId.length !== 6) {
          showError('Vui lòng nhập đúng mã phòng gồm 6 chữ số');
          return;
        }

        if (!auth || auth.length !== 4) {
          showError('Vui lòng nhập đúng mật khẩu gồm 4 chữ số');
          return;
        }

        // Lấy state mới nhất từ server để đối soát chính xác
        if (typeof window.fetchServerState === 'function') {
          await window.fetchServerState();
        }

        const roomAuth = window.currentGameState?.roomAuth || {
          roomId: '123456',
          passwords: { 1: '1111', 2: '2222', 3: '3333', 4: '4444' }
        };

        const serverRoom = String(roomAuth.roomId || '123456');
        const serverPass = String(roomAuth.passwords?.[playerVal] || '');

        if (roomId !== serverRoom) {
          showError('Mã phòng không chính xác. Vui lòng kiểm tra lại');
          return;
        }

        if (auth !== serverPass) {
          showError(`Mật khẩu của Player ${playerVal} không chính xác`);
          return;
        }

        // Đăng nhập thành công -> chuyển hướng ngay lập tức kèm URL parameters
        window.location.href = `Player${playerVal}.html?roomid=${encodeURIComponent(roomId)}&auth=${encodeURIComponent(auth)}`;
      });
    </script>
  </body>
</html>
